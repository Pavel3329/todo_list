<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Todo List</title>

    <link rel="stylesheet" href="styles/style.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&display=swap"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>

  <body>
    <main class="app">
      <header class="header-group">
        <h1 class="main-header">Среда</h1>
        <p class="header-group__sub-header">3 января</p>
      </header>

      <div class="search-field">
        <input
          class="search-field__input"
          type="text"
          placeholder="Поиск"
          id="search-input"
        />

        <span class="search-field__icon material-symbols-rounded">
          search
        </span>
      </div>

      <div class="split-button">
        <button
          class="split-button__button split-button__button--active"
          id="filter-all"
          type="button"
        >
          <span class="material-symbols-rounded split-button__button-icon">
            check
          </span>

          Все
        </button>

        <button
          class="split-button__button split-button__button--center"
          id="filter-active"
          type="button"
        >
          <span class="material-symbols-rounded split-button__button-icon">
            check
          </span>

          Активные
        </button>

        <button class="split-button__button" id="filter-done" type="button">
          <span class="material-symbols-rounded split-button__button-icon">
            check
          </span>

          Завершенные
        </button>
      </div>

      <ul class="todo-list" id="todo-list"></ul>

      <button
        class="float-button"
        id="open-form-button"
        type="button"
        aria-label="Добавить задачу"
      >
        <span class="material-symbols-rounded"> edit </span>
      </button>
    </main>

    <div class="modal" id="create-modal">
      <div class="modal__overlay"></div>

      <section class="create-sheet">
        <div class="create-sheet__handle"></div>

        <form class="create-form" id="create-form">
          <input
            class="create-form__input"
            type="text"
            name="description"
            id="description"
            placeholder="Описание"
            required
          />

          <input
            class="create-form__input"
            type="datetime-local"
            name="startDate"
            id="startDate"
            required
          />

          <div class="reminder">
            <span class="reminder__text"> Напомнить мне </span>

            <label class="switch">
              <input type="checkbox" id="reminder" />

              <span class="switch__slider"></span>
            </label>
          </div>

          <div class="form__buttons-wrapper">
            <button class="form-button form-button--primary" type="submit">
              Добавить
            </button>

            <button
              class="form-button form-button--secondary"
              id="cancel-form-button"
              type="button"
            >
              Отмена
            </button>
          </div>
        </form>
      </section>
    </div>

    <script src="scripts/script.js"></script>
  </body>
</html>
